<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📚 Encyclopédie intelligente · Bleu-Blanc-Rouge · © gunout</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a12;
            color: #fff;
            padding: 24px 16px 16px;
            min-height: 100vh;
        }

        /* ===== Barre tricolore fixe ===== */
        .tricolore {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 4px;
            display: flex;
            z-index: 1000;
        }
        .tricolore span { flex: 1; }
        .tricolore .t-bleu { background: #0055A4; }
        .tricolore .t-blanc { background: #ffffff; }
        .tricolore .t-rouge { background: #EF4135; }

        .header {
            text-align: center;
            padding: 25px 20px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #0d1b3a, #14213d);
            border-radius: 16px;
            border: 1px solid #2a2a4a;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg,
                #0055A4 0%, #0055A4 33.33%,
                #ffffff 33.33%, #ffffff 66.66%,
                #EF4135 66.66%, #EF4135 100%);
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #5C9EFF, #ffffff, #FF5252);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p { color: #8899bb; font-size: 0.95rem; margin-top: 6px; }

        .main-container { max-width: 1200px; margin: 0 auto; }

        .search-section {
            background: #1a1a2e;
            padding: 18px 20px;
            border-radius: 16px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }
        .search-section .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .search-section input[type="text"] {
            flex: 1;
            min-width: 180px;
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid #333;
            background: #0a0a0f;
            color: #fff;
            font-size: 1.1rem;
            font-family: monospace;
        }
        .search-section input[type="text"]:focus {
            border-color: #0055A4;
            outline: none;
            box-shadow: 0 0 0 2px rgba(0, 85, 164, 0.25);
        }
        .search-section button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .search-section button:hover { transform: scale(1.05); }
        .btn-primary { background: #0055A4; color: #fff; }
        .btn-random  { background: #ffffff; color: #0a0a12; }
        .btn-clear   { background: #EF4135; color: #fff; }

        .quick-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .quick-buttons button {
            padding: 3px 10px;
            border-radius: 14px;
            border: 1px solid #333;
            background: transparent;
            color: #888;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quick-buttons button:hover { border-color: #4A90E2; color: #fff; }

        .type-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin: 6px 0;
        }
        .type-badge.number { background: #0055A4; color: #fff; }
        .type-badge.text { background: #ffffff; color: #0a0a12; }
        .type-badge.mixed { background: transparent; border: 1px solid #EF4135; color: #FF5252; }
        .type-badge.prime { background: #EF4135; color: #fff; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 8px;
            margin-bottom: 12px;
        }
        .stat-card {
            background: #1a1a2e;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #333;
            transition: all 0.3s;
        }
        .stat-card:hover { border-color: #4A90E2; }
        .stat-card .label {
            color: #666;
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-card .value {
            font-size: 0.95rem;
            font-weight: 700;
            margin-top: 3px;
            font-family: monospace;
            word-break: break-all;
        }
        .stat-card .value.bleu { color: #4A90E2; }
        .stat-card .value.blanc { color: #ffffff; }
        .stat-card .value.rouge { color: #FF5252; }

        .section-title {
            color: #ccc;
            font-size: 1rem;
            font-weight: 700;
            margin: 16px 0 8px 0;
            padding-bottom: 5px;
            border-bottom: 2px solid #333;
            border-image: linear-gradient(90deg, #0055A4, #ffffff, #EF4135) 1;
        }
        .section-title .emoji { margin-right: 8px; }

        .color-preview {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            background: #1a1a2e;
            border-radius: 10px;
            border: 1px solid #333;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .color-preview .swatch {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            border: 2px solid #444;
            flex-shrink: 0;
        }
        .color-preview .info { font-family: monospace; font-size: 0.85rem; }
        .color-preview .info .label { color: #666; font-size: 0.5rem; text-transform: uppercase; }
        .color-preview .info .value { color: #fff; }

        .hash-table {
            width: 100%;
            border-collapse: collapse;
            font-family: monospace;
            font-size: 0.7rem;
            background: #1a1a2e;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .hash-table th {
            color: #666;
            padding: 6px 10px;
            text-align: left;
            border-bottom: 2px solid #333;
            font-size: 0.55rem;
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }
        .hash-table th:hover {
            color: #4A90E2;
            background: #0a0a0f;
        }
        .hash-table th.sorted-asc::after { content: ' ▲'; color: #4A90E2; }
        .hash-table th.sorted-desc::after { content: ' ▼'; color: #FF5252; }
        .hash-table td {
            padding: 5px 10px;
            border-bottom: 1px solid #222;
            color: #ddd;
            word-break: break-all;
        }
        .hash-table td:first-child { color: #4A90E2; white-space: nowrap; }
        .hash-table td .copy-btn {
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.5rem;
        }
        .hash-table td .copy-btn:hover { border-color: #4A90E2; color: #fff; }
        .hash-table tr:hover td { background: #0a0a0f; }

        .tag { font-size: 0.5rem; margin-left: 4px; }
        .tag.warn { color: #FF8A80; }
        .tag.ok { color: #4A90E2; }
        .hash-note {
            font-size: 0.6rem;
            color: #666;
            margin-top: 6px;
            font-family: monospace;
            line-height: 1.5;
        }

        .divisors-list {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            margin-top: 3px;
        }
        .divisors-list .div {
            background: #0a0a0f;
            padding: 2px 8px;
            border-radius: 8px;
            border: 1px solid #333;
            font-family: monospace;
            font-size: 0.65rem;
            color: #ddd;
        }
        .divisors-list .div.prime { border-color: #EF4135; color: #FF5252; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #4A90E2;
            font-family: monospace;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }
        .toast.show { opacity: 1; }

        .factor-tree {
            font-family: monospace;
            font-size: 0.85rem;
            color: #4A90E2;
            padding: 8px 12px;
            background: #0a0a0f;
            border-radius: 8px;
            border: 1px solid #333;
            text-align: center;
            line-height: 1.8;
        }

        .relation-box {
            background: #1a1a2e;
            padding: 16px 20px;
            border-radius: 12px;
            border: 2px solid #EF4135;
            margin-bottom: 16px;
        }
        .relation-box .title {
            color: #FF5252;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .relation-box .content {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .relation-box .item {
            background: #0a0a0f;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #333;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .relation-box .item .lbl { color: #666; font-size: 0.55rem; text-transform: uppercase; }
        .relation-box .item .val { color: #4A90E2; }

        .word-analysis {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }
        .word-analysis .char {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            font-family: monospace;
            border: 1px solid #333;
        }

        /* ===== Module Base 10 — Montée / Descente ===== */
        .b10-panel {
            background: linear-gradient(135deg, #0d1b3a, #1a1a2e);
            border: 2px solid #0055A4;
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
        }
        .b10-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #0055A4, #fff, #EF4135);
        }
        .b10-panel .title {
            font-size: 1rem;
            font-weight: 700;
            background: linear-gradient(90deg, #5C9EFF, #fff, #FF5252);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        .b10-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
        }
        .b10-card {
            background: #0a0a0f;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 10px 14px;
        }
        .b10-card .lbl {
            color: #666;
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .b10-card .val {
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 4px;
        }
        .b10-card .val.monte   { color: #4A90E2; }
        .b10-card .val.descend { color: #FF5252; }
        .b10-card .val.lettre  { color: #ffffff; }

        .b10-steps {
            font-family: monospace;
            font-size: 0.8rem;
            color: #ccc;
            background: #0a0a0f;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 10px;
            line-height: 1.8;
        }
        .b10-steps .arrow-up   { color: #4A90E2; font-weight: 700; }
        .b10-steps .arrow-down { color: #FF5252; font-weight: 700; }
        .b10-steps .result     { color: #fff; font-weight: 700; font-size: 1rem; }
        .b10-steps .base10     { color: #FFD700; }

        .b10-toggle {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .b10-toggle button {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #333;
            background: transparent;
            color: #888;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .b10-toggle button.active {
            background: #0055A4;
            border-color: #0055A4;
            color: #fff;
        }
        .b10-toggle button:hover { border-color: #4A90E2; color: #fff; }

        /* ===== Recherche inversée ===== */
        .reverse-panel {
            background: linear-gradient(135deg, #2a0d1b, #1a1a2e);
            border: 2px solid #FFD700;
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 18px;
        }
        .reverse-panel .title {
            font-size: 1rem;
            font-weight: 700;
            background: linear-gradient(90deg, #FFD700, #fff, #FF5252);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        .reverse-panel input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid #444;
            background: #0a0a0f;
            color: #FFD700;
            font-size: 0.9rem;
            font-family: monospace;
            margin-bottom: 10px;
        }
        .reverse-panel input:focus {
            border-color: #FFD700;
            outline: none;
            box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.2);
        }
        .reverse-result {
            background: #0a0a0f;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 14px;
            margin-top: 10px;
            font-family: monospace;
        }
        .reverse-result .match {
            color: #4A90E2;
            font-weight: 700;
            font-size: 1.4rem;
            margin-bottom: 6px;
        }
        .reverse-result .algo {
            color: #FFD700;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }
        .reverse-result .hash {
            color: #ccc;
            font-size: 0.7rem;
            word-break: break-all;
        }
        .reverse-result .nope {
            color: #FF5252;
            font-weight: 700;
        }

        /* ===== Signature © gunout ===== */
        .footer {
            text-align: center;
            padding: 26px 16px 8px;
            margin-top: 28px;
            border-top: 1px solid #2a2a4a;
        }
        .flag-mini {
            display: inline-flex;
            width: 42px;
            height: 28px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #3a3a5a;
            margin-bottom: 10px;
        }
        .flag-stripe { flex: 1; }
        .f-bleu { background: #0055A4; }
        .f-blanc { background: #ffffff; }
        .f-rouge { background: #EF4135; }
        .devise {
            color: #99a5c4;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .copyright {
            color: #777;
            font-size: 0.85rem;
            font-family: monospace;
        }
        .copyright .signature-gunout {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #5C9EFF, #ffffff, #FF5252);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.3rem; }
            .search-section .input-group { flex-direction: column; }
            .search-section input[type="text"] { width: 100%; }
            .search-section button { width: 100%; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="tricolore">
        <span class="t-bleu"></span>
        <span class="t-blanc"></span>
        <span class="t-rouge"></span>
    </div>

    <div class="main-container">
        <div class="header">
            <h1>📚 Encyclopédie intelligente</h1>
            <p>Mots ↔ Nombres · Base 10 · Hashs vérifiés · Recherche inversée · 🇫🇷</p>
        </div>

        <div class="search-section">
            <div class="input-group">
                <input type="text" id="searchInput" placeholder="Ex: Paris, 16118919, 2.1.19.5, 67, un hash MD5..." />
                <button class="btn-primary" onclick="analyze()">🔍 Analyser</button>
                <button class="btn-random" onclick="randomInput()">🎲 Aléatoire</button>
                <button class="btn-clear" onclick="clearResults()">✖ Effacer</button>
            </div>
            <div class="quick-buttons">
                <button onclick="quickSearch('Paris')">Paris</button>
                <button onclick="quickSearch('capitale')">capitale</button>
                <button onclick="quickSearch('2.1.19.5')">2.1.19.5 (BASE)</button>
                <button onclick="quickSearch('1.18.14')">1.18.14 (ARN)</button>
                <button onclick="quickSearch('3.20.24')">3.20.24 (CTX)</button>
                <button onclick="quickSearch('67')">67</button>
                <button onclick="quickSearch('23.44')">23.44</button>
                <button onclick="showHashGenerator()" style="border-color:#FFD700; color:#FFD700;">🔐 Générateur Hashs</button>
                <button onclick="showReverseSearch()" style="border-color:#FFD700; color:#FFD700;">🔄 Recherche inversée</button>
            </div>
        </div>

        <div id="results">
            <div style="text-align:center; color:#555; padding:60px 20px;">
                <div style="font-size:4rem; margin-bottom:16px;">🔍</div>
                <div style="font-size:1.2rem;">Entrez un mot, un nombre ou un hash</div>
                <div style="font-size:0.9rem; margin-top:8px; color:#666;">
                    Base 10 · Montée / Descente · Hashs vérifiés RFC/NIST
                </div>
            </div>
        </div>

        <footer class="footer">
            <div class="flag-mini">
                <div class="flag-stripe f-bleu"></div>
                <div class="flag-stripe f-blanc"></div>
                <div class="flag-stripe f-rouge"></div>
            </div>
            <div class="devise">Liberté · Égalité · Fraternité</div>
            <div class="copyright">
                © <span id="copyrightYear">2025</span> · <span class="signature-gunout">gunout</span> · Tous droits réservés
            </div>
        </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        'use strict';

        // ============================================================
        // © gunout — Thème Bleu · Blanc · Rouge
        // ============================================================
        const WORD_TO_NUMBER = {
            'paris': 16118919,
            'capitale': 31169201125,
            'france': 289732198,
            'liberte': 18329471,
            'egalite': 20357931,
            'fraternite': 48172934,
            'republique': 39284710,
            'democratie': 29184736,
            'bonjour': 19827361,
            'eurostat': 42987163,
            'revenu': 28194726,
            'median': 19284736,
            'quantile': 39284719,
            'inflation': 48293716,
            'emploi': 19283746,
            'gdp': 18293746,
            'ppa': 19283746,
            'europe': 29183746,
            'monde': 18293746,
            // Mots décodés Base 10
            'base': 21195,
            'arn': 11814,
            'ctx': 32024,
            'ct': 320,
            'qd': 174
        };

        const utf8 = new TextEncoder();

        // ============================================================
        // FONCTIONS UTILITAIRES
        // ============================================================
        function formatNumber(n) { return n.toLocaleString('fr-FR'); }

        function isPrime(n) {
            if (n < 2) return false;
            if (n % 2 === 0) return n === 2;
            for (let i = 3; i <= Math.sqrt(n); i += 2) if (n % i === 0) return false;
            return true;
        }

        function getDivisors(n) {
            const divs = [];
            for (let i = 1; i <= Math.sqrt(n); i++) {
                if (n % i === 0) { divs.push(i); if (i !== n / i) divs.push(n / i); }
            }
            return divs.sort((a, b) => a - b);
        }

        function getPrimeFactors(n) {
            const factors = [];
            let num = n;
            for (let i = 2; i <= Math.sqrt(num); i++) {
                while (num % i === 0) { factors.push(i); num /= i; }
            }
            if (num > 1) factors.push(num);
            return factors;
        }

        function hashFnv1a(str) {
            let hash = 0x811c9dc5;
            for (let i = 0; i < str.length; i++) {
                hash ^= str.charCodeAt(i);
                hash = (hash * 0x01000193) >>> 0;
            }
            return hash;
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max === min) { h = s = 0; }
            else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                    case g: h = ((b - r) / d + 2) / 6; break;
                    case b: h = ((r - g) / d + 4) / 6; break;
                }
            }
            return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
        }

        function isNumeric(str) { return /^-?\d+(\.\d+)?$/.test(str.trim()); }
        function isInteger(str) { return /^-?\d+$/.test(str.trim()); }
        function detectType(input) {
            const trimmed = input.trim();
            if (isInteger(trimmed)) return 'integer';
            if (isNumeric(trimmed)) return 'decimal';
            return 'text';
        }

        function isPerfect(n) {
            return getDivisors(n).reduce((a, b) => a + b, 0) === 2 * n;
        }
        function isAbundant(n) {
            return getDivisors(n).reduce((a, b) => a + b, 0) > 2 * n;
        }
        function isDeficient(n) {
            return getDivisors(n).reduce((a, b) => a + b, 0) < 2 * n;
        }
        function isHarshad(n) {
            const sum = n.toString().split('').reduce((a, b) => a + parseInt(b), 0);
            return n % sum === 0;
        }
        function isPalindrome(n) {
            return n.toString() === n.toString().split('').reverse().join('');
        }
        function isFibonacci(n) {
            const a = 5 * n * n + 4, b = 5 * n * n - 4;
            return Math.sqrt(a) % 1 === 0 || Math.sqrt(b) % 1 === 0;
        }
        function isPowerOfTwo(n) { return (n & (n - 1)) === 0 && n > 0; }
        function isArmstrong(n) {
            const digits = n.toString().split('').map(Number);
            const power = digits.length;
            return digits.reduce((a, b) => a + Math.pow(b, power), 0) === n;
        }

        function renderCard(label, value, className = '') {
            return `

        }

        // ============================================================
        // 🔐 HASHS RÉELS — RFC 1321 / FIPS 180-4 / IEEE 802.3
        // ============================================================
        function rotl32(x, n) { return ((x << n) | (x >>> (32 - n))) | 0; }
        function rotr32(x, n) { return ((x >>> n) | (x << (32 - n))) | 0; }

        const CRC32_TABLE = (() => {
            const t = new Uint32Array(256);
            for (let n = 0; n < 256; n++) {
                let c = n;
                for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
                t[n] = c;
            }
            return t;
        })();

        function crc32hex(str) {
            const bytes = utf8.encode(str);
            let crc = 0xFFFFFFFF;
            for (let i = 0; i < bytes.length; i++) {
                crc = CRC32_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
            }
            return ((crc ^ 0xFFFFFFFF) >>> 0).toString(16).padStart(8, '0').toUpperCase();
        }

        const MD5_K = [
            0xd76aa478, 0xe8c7b756, 0x242070db, 0xc1bdceee, 0xf57c0faf, 0x4787c62a, 0xa8304613, 0xfd469501,
            0x698098d8, 0x8b44f7af, 0xffff5bb1, 0x895cd7be, 0x6b901122, 0xfd987193, 0xa679438e, 0x49b40821,
            0xf61e2562, 0xc040b340, 0x265e5a51, 0xe9b6c7aa, 0xd62f105d, 0x02441453, 0xd8a1e681, 0xe7d3fbc8,
            0x21e1cde6, 0xc33707d6, 0xf4d50d87, 0x455a14ed, 0xa9e3e905, 0xfcefa3f8, 0x676f02d9, 0x8d2a4c8a,
            0xfffa3942, 0x8771f681, 0x6d9d6122, 0xfde5380c, 0xa4beea44, 0x4bdecfa9, 0xf6bb4b60, 0xbebfbc70,
            0x289b7ec6, 0xeaa127fa, 0xd4ef3085, 0x04881d05, 0xd9d4d039, 0xe6db99e5, 0x1fa27cf8, 0xc4ac5665,
            0xf4292244, 0x432aff97, 0xab9423a7, 0xfc93a039, 0x655b59c3, 0x8f0ccc92, 0xffeff47d, 0x85845dd1,
            0x6fa87e4f, 0xfe2ce6e0, 0xa3014314, 0x4e0811a1, 0xf7537e82, 0xbd3af235, 0x2ad7d2bb, 0xeb86d391
        ];
        const MD5_S = [
            7,12,17,22, 7,12,17,22, 7,12,17,22, 7,12,17,22,
            5, 9,14,20, 5, 9,14,20, 5, 9,14,20, 5, 9,14,20,
            4,11,16,23, 4,11,16,23, 4,11,16,23, 4,11,16,23,
            6,10,15,21, 6,10,15,21, 6,10,15,21, 6,10,15,21
        ];

        function md5(str) {
            const msg = utf8.encode(str);
            const ml = msg.length;
            const totalLen = ((((ml + 8) >> 6) + 1) << 6);
            const bytes = new Uint8Array(totalLen);
            bytes.set(msg);
            bytes[ml] = 0x80;
            const dv = new DataView(bytes.buffer);
            dv.setUint32(totalLen - 8, Math.floor(ml / 536870912), true);
            dv.setUint32(totalLen - 4, (ml * 8) >>> 0, true);

            let a0 = 0x67452301|0, b0 = 0xefcdab89|0, c0 = 0x98badcfe|0, d0 = 0x10325476|0;
            const M = new Int32Array(16);

            for (let off = 0; off < totalLen; off += 64) {
                for (let i = 0; i < 16; i++) M[i] = dv.getInt32(off + i * 4, true);
                let A = a0, B = b0, C = c0, D = d0;
                for (let i = 0; i < 64; i++) {
                    let F, g;
                    if (i < 16)      { F = (B & C) | (~B & D); g = i; }
                    else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) & 15; }
                    else if (i < 48) { F = B ^ C ^ D;          g = (3 * i + 5) & 15; }
                    else             { F = C ^ (B | ~D);       g = (7 * i) & 15; }
                    F = (F + A + MD5_K[i] + M[g]) | 0;
                    A = D; D = C; C = B;
                    B = (B + rotl32(F, MD5_S[i])) | 0;
                }
                a0 = (a0 + A) | 0; b0 = (b0 + B) | 0; c0 = (c0 + C) | 0; d0 = (d0 + D) | 0;
            }
            const out = new DataView(new ArrayBuffer(16));
            out.setInt32(0, a0, true); out.setInt32(4, b0, true);
            out.setInt32(8, c0, true); out.setInt32(12, d0, true);
            let hex = '';
            const u8 = new Uint8Array(out.buffer);
            for (let i = 0; i < 16; i++) hex += u8[i].toString(16).padStart(2, '0');
            return hex;
        }

        function sha1(str) {
            const msg = utf8.encode(str);
            const ml = msg.length;
            const totalLen = ((((ml + 8) >> 6) + 1) << 6);
            const bytes = new Uint8Array(totalLen);
            bytes.set(msg);
            bytes[ml] = 0x80;
            const dv = new DataView(bytes.buffer);
            dv.setUint32(totalLen - 8, Math.floor(ml / 536870912), false);
            dv.setUint32(totalLen - 4, (ml * 8) >>> 0, false);

            let h0 = 0x67452301|0, h1 = 0xEFCDAB89|0, h2 = 0x98BADCFE|0,
                h3 = 0x10325476|0, h4 = 0xC3D2E1F0|0;
            const w = new Int32Array(80);
            for (let off = 0; off < totalLen; off += 64) {
                for (let i = 0; i < 16; i++) w[i] = dv.getInt32(off + i * 4, false);
                for (let i = 16; i < 80; i++) w[i] = rotl32(w[i-3] ^ w[i-8] ^ w[i-14] ^ w[i-16], 1);
                let a = h0, b = h1, c = h2, d = h3, e = h4;
                for (let i = 0; i < 80; i++) {
                    let f, k;
                    if (i < 20)      { f = (b & c) | (~b & d);          k = 0x5A827999; }
                    else if (i < 40) { f = b ^ c ^ d;                   k = 0x6ED9EBA1; }
                    else if (i < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
                    else             { f = b ^ c ^ d;                   k = 0xCA62C1D6; }
                    const t = (rotl32(a, 5) + f + e + k + w[i]) | 0;
                    e = d; d = c; c = rotl32(b, 30); b = a; a = t;
                }
                h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0;
                h3 = (h3 + d) | 0; h4 = (h4 + e) | 0;
            }
            return [h0,h1,h2,h3,h4].map(x => (x >>> 0).toString(16).padStart(8,'0')).join('');
        }

        const SHA256_K = [
            0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
            0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
            0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
            0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
            0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
            0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
            0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
            0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
        ];

        function sha256(str) {
            const msg = utf8.encode(str);
            const ml = msg.length;
            const totalLen = ((((ml + 8) >> 6) + 1) << 6);
            const bytes = new Uint8Array(totalLen);
            bytes.set(msg);
            bytes[ml] = 0x80;
            const dv = new DataView(bytes.buffer);
            dv.setUint32(totalLen - 8, Math.floor(ml / 536870912), false);
            dv.setUint32(totalLen - 4, (ml * 8) >>> 0, false);

            let h0=0x6a09e667|0,h1=0xbb67ae85|0,h2=0x3c6ef372|0,h3=0xa54ff53a|0,
                h4=0x510e527f|0,h5=0x9b05688c|0,h6=0x1f83d9ab|0,h7=0x5be0cd19|0;
            const w = new Int32Array(64);
            for (let off = 0; off < totalLen; off += 64) {
                for (let i = 0; i < 16; i++) w[i] = dv.getInt32(off + i * 4, false);
                for (let i = 16; i < 64; i++) {
                    const s0 = rotr32(w[i-15],7) ^ rotr32(w[i-15],18) ^ (w[i-15] >>> 3);
                    const s1 = rotr32(w[i-2],17) ^ rotr32(w[i-2],19) ^ (w[i-2] >>> 10);
                    w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
                }
                let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
                for (let i = 0; i < 64; i++) {
                    const S1 = rotr32(e,6) ^ rotr32(e,11) ^ rotr32(e,25);
                    const ch = (e & f) ^ (~e & g);
                    const t1 = (h + S1 + ch + SHA256_K[i] + w[i]) | 0;
                    const S0 = rotr32(a,2) ^ rotr32(a,13) ^ rotr32(a,22);
                    const maj = (a & b) ^ (a & c) ^ (b & c);
                    const t2 = (S0 + maj) | 0;
                    h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
                }
                h0=(h0+a)|0;h1=(h1+b)|0;h2=(h2+c)|0;h3=(h3+d)|0;
                h4=(h4+e)|0;h5=(h5+f)|0;h6=(h6+g)|0;h7=(h7+h)|0;
            }
            return [h0,h1,h2,h3,h4,h5,h6,h7].map(x => (x >>> 0).toString(16).padStart(8,'0')).join('');
        }

        async function webcryptoHex(algo, text) {
            const data = utf8.encode(text);
            const buf = await window.crypto.subtle.digest(algo, data);
            const u8 = new Uint8Array(buf);
            let hex = '';
            for (let i = 0; i < u8.length; i++) hex += u8[i].toString(16).padStart(2, '0');
            return hex;
        }

        async function buildHashTable(text) {
            const INDISPONIBLE = '🔒 indisponible (contexte non sécurisé)';
            const rows = [
                { name: 'CRC-32',  tag: 'contrôle',  tagClass: '',    val: crc32hex(text) },
                { name: 'FNV-1a',  tag: '32 bits',   tagClass: '',    val: '0x' + hashFnv1a(text).toString(16).toUpperCase().padStart(8, '0') },
                { name: 'MD5',     tag: '⚠ obsolète', tagClass: 'warn', val: md5(text) },
                { name: 'SHA-1',   tag: '⚠ obsolète', tagClass: 'warn', val: sha1(text) },
                { name: 'SHA-256', tag: '✓ sûr',     tagClass: 'ok',  val: sha256(text) }
            ];
            if (window.crypto && window.crypto.subtle) {
                try {
                    rows.push({ name: 'SHA-384', tag: '✓ sûr', tagClass: 'ok', val: await webcryptoHex('SHA-384', text) });
                    rows.push({ name: 'SHA-512', tag: '✓ sûr', tagClass: 'ok', val: await webcryptoHex('SHA-512', text) });
                } catch (e) {}
            }
            if (rows.length < 7) {
                rows.push({ name: 'SHA-384', tag: '✓ sûr', tagClass: 'ok', val: INDISPONIBLE, noCopy: true });
                rows.push({ name: 'SHA-512', tag: '✓ sûr', tagClass: 'ok', val: INDISPONIBLE, noCopy: true });
            }
            let b64 = '—';
            try {
                const bytes = utf8.encode(text);
                b64 = btoa(String.fromCharCode.apply(null, bytes));
            } catch (e) {}
            rows.push({ name: 'Base64', tag: 'encodage', tagClass: '', val: b64 });

            const body = rows.map(r => `
                <tr>
                    <td>${r.name}${r.tag ? ` <span class="tag ${r.tagClass}">${r.tag}</span>` : ''}</td>
                    <td>${r.val}</td>
                    <td>${r.noCopy ? '—' : `<button class="copy-btn" onclick="copyText('${r.val}')">Copier</button>`}</td>
                </tr>`).join('');

            return `
                <table class="hash-table">
                    <thead><tr><th>Algorithme</th><th>Empreinte réelle</th><th>Action</th></tr></thead>
                    <tbody>${body}</tbody>
                </table>
                <div class="hash-note">
                    ℹ️ Algorithmes réels et vérifiables — ex : MD5("abc") = 900150983cd24fb0d6963f7d28e17f72.<br>
                    SHA-384/SHA-512 : API WebCrypto native · MD5 et SHA-1 : réels mais obsolètes pour la sécurité.
                </div>
            `;
        }

        // ============================================================
        // 🧠 MODULE BASE 10 — MONTÉE / DESCENTE
        // ============================================================
        function numberToLetter(n) {
            if (n >= 1 && n <= 26) return String.fromCharCode(64 + n);
            return null;
        }

        function monte(chiffres) {
            const digits = String(chiffres).split('').map(Number);
            const somme = digits.reduce((a, b) => a + b, 0);
            return {
                operation: digits.join(' + ') + ' = ' + somme,
                resultat: somme,
                lettre: numberToLetter(somme)
            };
        }

        function descend(chiffres) {
            const digits = String(chiffres).split('').map(Number);
            let resultat = digits[digits.length - 1];
            const ops = [String(digits[digits.length - 1])];
            for (let i = digits.length - 2; i >= 0; i--) {
                resultat -= digits[i];
                ops.push('- ' + digits[i]);
            }
            const abs = Math.abs(resultat);
            return {
                operation: ops.join(' ') + ' = ' + resultat + (resultat < 0 ? ' → |' + resultat + '|' : ''),
                resultat: resultat,
                valeurAbsolue: abs,
                lettre: numberToLetter(abs)
            };
        }

        function decodeBase10Sequence(seq) {
            const parts = seq.split('.').filter(p => p.trim() !== '');
            const lettres = [];
            const details = [];
            for (const p of parts) {
                const n = parseInt(p, 10);
                if (!isNaN(n)) {
                    const lettre = numberToLetter(n);
                    lettres.push(lettre || '?');
                    details.push({ nombre: n, lettre: lettre || '?' });
                }
            }
            return { lettres: lettres.join(''), details };
        }

        function analyseBase10(n) {
            return { montee: monte(n), descente: descend(n) };
        }

        async function analyzeWord(text) {
            const lowerText = text.toLowerCase();

            const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
            const letters = text.split('');
            const letterValues = letters.map(c => {
                const code = c.toUpperCase().charCodeAt(0) - 64;
                return code >= 1 && code <= 26 ? code : 0;
            });
            const sumLetters = letterValues.reduce((a, b) => a + b, 0);
            const validLetters = letterValues.filter(v => v > 0);
            const avgLetter = validLetters.length > 0 ? (sumLetters / validLetters.length) : 0;
            const words = text.split(/\s+/).filter(w => w.length > 0);

        // ============================================================
        // 🔐 GÉNÉRATEUR DE HASHS VÉRIFIÉS — Tri & Export
        // ============================================================
        async function generateHashesForRange(start, end) {
            const results = [];
            for (let n = start; n <= end; n++) {
                const s = String(n);
                const entry = {
                    nombre: n,
                    binaire: n.toString(2),
                    octal: n.toString(8),
                    hex: '0x' + n.toString(16).toUpperCase(),
                    base36: n.toString(36).toUpperCase(),
                    crc32: crc32hex(s),
                    fnv1a: '0x' + hashFnv1a(s).toString(16).toUpperCase().padStart(8, '0'),
                    md5: md5(s),
                    sha1: sha1(s),
                    sha256: sha256(s),
                    sha384: null,
                    sha512: null,
                    base64: btoa(s)
                };
                if (window.crypto && window.crypto.subtle) {
                    try {
                        entry.sha384 = await webcryptoHex('SHA-384', s);
                        entry.sha512 = await webcryptoHex('SHA-512', s);
                    } catch (e) {}
                }
                results.push(entry);
            }
            return results;
        }

        function sortHashes(entries, by = 'nombre', dir = 'asc') {
            const sorted = [...entries].sort((a, b) => {
                const va = a[by], vb = b[by];
                if (typeof va === 'number' && typeof vb === 'number') return va - vb;
                return String(va ?? '').localeCompare(String(vb ?? ''));
            });
            return dir === 'desc' ? sorted.reverse() : sorted;
        }

        // État global pour le tri
        window._hashData = [];
        window._hashSortBy = 'nombre';
        window._hashSortDir = 'asc';

                { key: 'fnv1a', label: 'FNV-1a' },
                { key: 'md5', label: 'MD5' },
                { key: 'sha1', label: 'SHA-1' },
                { key: 'sha256', label: 'SHA-256' },
                { key: 'sha384', label: 'SHA-384' },
                { key: 'sha512', label: 'SHA-512' },
                { key: 'base64', label: 'Base64' }
            ];
            const ths = cols.map(c => {
                let cls = '';
                if (window._hashSortBy === c.key) {
                    cls = window._hashSortDir === 'asc' ? 'sorted-asc' : 'sorted-desc';
                }
                return `<th class="${cls}" onclick="sortHashGrid('${c.key}')">${c.label}</th>`;
            }).join('');

            const rows = entries.map(e => `

                    <td style="color:#5C9EFF;">${e.sha384 ? e.sha384.slice(0, 24) + '…' : '—'}</td>
                    <td style="color:#5C9EFF;">${e.sha512 ? e.sha512.slice(0, 24) + '…' : '—'}</td>

            return `

        window.sortHashGrid = function(key) {
            if (window._hashSortBy === key) {
                window._hashSortDir = window._hashSortDir === 'asc' ? 'desc' : 'asc';
            } else {
                window._hashSortBy = key;
                window._hashSortDir = 'asc';
            }
            const sorted = sortHashes(window._hashData, window._hashSortBy, window._hashSortDir);
            document.getElementById('hashGridContainer').innerHTML = renderHashGrid(sorted);
        };

        function exportHashes(entries, format = 'json') {
            let content, mime, filename;
            if (format === 'json') {
                content = JSON.stringify(entries, null, 2);
                mime = 'application/json';
                filename = 'hashs.json';
            } else {
                const headers = ['nombre','binaire','octal','hex','base36','crc32','fnv1a','md5','sha1','sha256','sha384','sha512','base64'];
                const rows = entries.map(e => headers.map(h => e[h] ?? '').join(','));
                content = headers.join(',') + '\n' + rows.join('\n');
                mime = 'text/csv';
                filename = 'hashs.csv';
            }
            const blob = new Blob([content], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        window._reverseDict = new Map();

        async function buildReverseDictionary(start, end) {
            const dict = window._reverseDict;
            for (let n = start; n <= end; n++) {
                const s = String(n);
                dict.set(crc32hex(s), { n, algo: 'CRC-32' });
                dict.set('0x' + hashFnv1a(s).toString(16).toUpperCase().padStart(8, '0'), { n, algo: 'FNV-1a' });
                dict.set(md5(s), { n, algo: 'MD5' });
                dict.set(sha1(s), { n, algo: 'SHA-1' });
                dict.set(sha256(s), { n, algo: 'SHA-256' });
                if (window.crypto && window.crypto.subtle) {
                    try {
                        dict.set(await webcryptoHex('SHA-384', s), { n, algo: 'SHA-384' });
                        dict.set(await webcryptoHex('SHA-512', s), { n, algo: 'SHA-512' });
                    } catch (e) {}
                }
            }
        }

                }

                const type = detectType(input);
                if (type === 'integer') {
                    const num = parseInt(input);
                    let foundWord = null;
                    for (const [word, number] of Object.entries(WORD_TO_NUMBER)) {
                        if (number === num) { foundWord = word; break; }

            ];
            let ok = true;
            for (const [seq, expected] of tests) {
                const got = decodeBase10Sequence(seq).lettres;
                const pass = got === expected;
                if (!pass) ok = false;
                console.log(`${pass ? '✅' : '❌'} ${seq} → ${got}${pass ? '' : ' (attendu: ' + expected + ')'}`);
            }
            const m = monte(67);
            const d = descend(67);
            console.log(`⬆️ 67 monte → ${m.resultat} (${m.lettre})`);
            console.log(`⬇️ 67 descend → ${d.valeurAbsolue} (${d.lettre})`);
            console.log(ok ? '%c✅ Module Base 10 opérationnel.' : '%c❌ Erreur Base 10.', 'font-weight:bold');
        })();

        // Chargement par défaut
        const params = new URLSearchParams(window.location.search);
        const query = params.get('q');
        if (query) {
            document.getElementById('searchInput').value = query;
            analyze();
        } else {
            document.getElementById('searchInput').value = 'Paris';
            analyze();
        }
    </script>
</body>
